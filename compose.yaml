name: finanzas-local

services:
  api:
    build: ./back
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA:-finanzas}
      DB_SSL: ${DB_SSL}
      APP_ENV: ${APP_ENV:-local}
      MOCK_AUTH_ENABLED: ${MOCK_AUTH_ENABLED:-true}
      INTEGRATION_MODE: ${INTEGRATION_MODE:-local-fixtures}
      INTEGRATION_VENTA_URL: ${INTEGRATION_VENTA_URL:-}
      INTEGRATION_ORDEN_COMPRA_URL: ${INTEGRATION_ORDEN_COMPRA_URL:-}
      INTEGRATION_REEMBOLSO_URL: ${INTEGRATION_REEMBOLSO_URL:-}
      INTEGRATION_USUARIO_URL: ${INTEGRATION_USUARIO_URL:-}
      API_HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/finanzas/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
