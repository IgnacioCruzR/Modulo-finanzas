name: finanzas-local

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_local
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - pg_finanzas_v2:/var/lib/postgresql/data
      - ./database/local/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/local/sql/02_operaciones.sql:/docker-entrypoint-initdb.d/02_operaciones.sql:ro
      - ./database/local/sql/04_cuotas.sql:/docker-entrypoint-initdb.d/04_cuotas.sql:ro
      - ./database/local/sql/06_modelo_central.sql:/docker-entrypoint-initdb.d/06_modelo_central.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./back
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: erp_local
      DB_USER: erp_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      DB_SCHEMA: finanzas
      DB_SSL: "false"
      APP_ENV: local
      MOCK_AUTH_ENABLED: "true"
      INTEGRATION_MODE: ${INTEGRATION_MODE:-local-fixtures}
      INTEGRATION_VENTA_URL: ${INTEGRATION_VENTA_URL:-}
      INTEGRATION_ORDEN_COMPRA_URL: ${INTEGRATION_ORDEN_COMPRA_URL:-}
      INTEGRATION_REEMBOLSO_URL: ${INTEGRATION_REEMBOLSO_URL:-}
      INTEGRATION_USUARIO_URL: ${INTEGRATION_USUARIO_URL:-}
      API_HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/finanzas/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_finanzas_v2:
